[phases.setup]
nixPkgs = ["nodejs_20", "openssl", "chromium"]
aptPkgs = [
  "fonts-liberation",
  "libappindicator3-1",
  "libasound2",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libcups2",
  "libdbus-1-3",
  "libdrm2",
  "libgbm1",
  "libgtk-3-0",
  "libnspr4",
  "libnss3",
  "libx11-xcb1",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "xdg-utils"
]

[phases.install]
cmds = [
  "echo DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy > .env",
  "npm install"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build:backend",
  "ls -la",
  "ls -la dist/ || echo 'dist directory not found!'"
]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"

[start]
cmd = "rm -f .env && export PUPPETEER_EXECUTABLE_PATH=$(which chromium) && npx prisma migrate deploy && node dist/main"
